name: Build project GIFs

on:
  push:
    branches: [main]
    paths:
      - "assets/**/*.png"
      - "assets/**/*.jpg"
      - "assets/**/*.jpeg"
      - "assets/**/*.webp"
      - "make_gif.py"
      - ".github/workflows/build-gifs.yml"
  workflow_dispatch:        # Actions tab se manually bhi chala sakte ho

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Build slideshow.gif for every project folder
        run: |
          built=0
          for dir in assets/*/; do
            dir="${dir%/}"
            # koi bhi screenshot (png/jpg/jpeg/webp) hai to hi GIF banao
            if find "$dir" -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) | grep -q .; then
              echo "▶ Building $dir"
              python make_gif.py "$dir"
              built=$((built+1))
            else
              echo "⏭  Skipping $dir (no screenshots)"
            fi
          done
          echo "Built $built GIF(s)"
          ls -la assets/*/slideshow.gif || true

      - name: Commit GIFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          if git diff --cached --quiet; then
            echo "No GIF changes to commit"
          else
            git commit -m "Auto-build project GIFs"
            git push
          fi
